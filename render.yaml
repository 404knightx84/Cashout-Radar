services:
  - type: web
    name: atm-sentinel
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt
      npm install
      npm run build
    startCommand: |
      uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: VITE_API_BASE_URL
        value: ""
      - key: VITE_WS_URL
        value: ""
