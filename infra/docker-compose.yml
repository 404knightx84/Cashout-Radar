services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: atm_sentinel
      POSTGRES_USER: atm_sentinel
      POSTGRES_PASSWORD: atm_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-replace-me-for-local}
      AUTH_DEV_FALLBACK: ${AUTH_DEV_FALLBACK:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-mock-bank-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atm_sentinel:atm_sentinel@postgres:5432/atm_sentinel}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WEB3_PROVIDER_URL: ${WEB3_PROVIDER_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailhog

volumes:
  postgres_data: